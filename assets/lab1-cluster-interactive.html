<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab 1 cluster components</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 24px 16px; background: #FFFFFF; color: #2C2C2A; }
  main { max-width: 720px; margin: 0 auto; }
  #steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  #steps button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid #D3D1C7; background: transparent; color: #5F5E5A; cursor: pointer; }
  #steps button[aria-pressed="true"] { background: #E6F1FB; border-color: #185FA5; color: #0C447C; }
  #cap { font-size: 14px; color: #5F5E5A; line-height: 1.6; min-height: 3em; }
  svg { width: 100%; height: auto; }
  .ts { font-size: 12px; fill: #5F5E5A; } .th { font-size: 14px; font-weight: 500; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .frame { fill: none; stroke: #888780; stroke-width: .8; stroke-dasharray: 5 4; }
  g > rect { stroke-width: .5; transition: fill .2s, stroke .2s; }
  .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
  .c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; } .c-gray .th { fill: #444441; } .c-gray .ts { fill: #5F5E5A; }
  .c-amber > rect { fill: #FAEEDA; stroke: #854F0B; } .c-amber .th { fill: #633806; } .c-amber .ts { fill: #854F0B; }
  .c-red > rect { fill: #FCEBEB; stroke: #A32D2D; } .c-red .th { fill: #791F1F; } .c-red .ts { fill: #A32D2D; }
</style>
</head>
<body>
<main>
<div id="steps"></div>
<svg viewBox="0 0 680 440" role="img" aria-label="Lab 1 cluster components">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="frame" x="180" y="20" width="470" height="210" rx="16"/>
<text class="ts" x="198" y="40">learn-control-plane · Docker container</text>
<rect class="frame" x="180" y="270" width="225" height="150" rx="16"/>
<text class="ts" x="198" y="290">learn-worker</text>
<rect class="frame" x="425" y="270" width="225" height="150" rx="16"/>
<text class="ts" x="443" y="290">learn-worker2</text>
<g id="kubectl"><rect x="30" y="56" width="130" height="56" rx="8"/><text class="th" x="95" y="80" text-anchor="middle">kubectl</text><text class="ts" x="95" y="98" text-anchor="middle">Your Mac</text></g>
<g id="api"><rect x="200" y="56" width="260" height="56" rx="8"/><text class="th" x="330" y="80" text-anchor="middle">API server</text><text class="ts" x="330" y="98" text-anchor="middle">The only door to etcd</text></g>
<g id="etcd"><rect x="480" y="56" width="150" height="56" rx="8"/><text class="th" x="555" y="80" text-anchor="middle">etcd</text><text class="ts" x="555" y="98" text-anchor="middle">Deploy → RS → Pods</text></g>
<g id="sched"><rect x="200" y="150" width="130" height="56" rx="8"/><text class="th" x="265" y="174" text-anchor="middle">Scheduler</text><text class="ts" x="265" y="192" text-anchor="middle">Picks a node</text></g>
<g id="cm"><rect x="350" y="150" width="130" height="56" rx="8"/><text class="th" x="415" y="174" text-anchor="middle">Controller mgr</text><text class="ts" x="415" y="192" text-anchor="middle">Fixes pod counts</text></g>
<g id="kcp"><rect x="500" y="150" width="130" height="56" rx="8"/><text class="th" x="565" y="174" text-anchor="middle">kubelet</text><text class="ts" x="565" y="192" text-anchor="middle">Reads manifests</text></g>
<line class="arr" x1="160" y1="84" x2="198" y2="84" marker-end="url(#arrow)"/>
<line class="arr" x1="460" y1="84" x2="478" y2="84" marker-end="url(#arrow)"/>
<line class="arr" x1="265" y1="150" x2="265" y2="114" marker-end="url(#arrow)"/>
<line class="arr" x1="415" y1="150" x2="415" y2="114" marker-end="url(#arrow)"/>
<g id="k1"><rect x="200" y="302" width="185" height="40" rx="8"/><text class="th" x="292" y="327" text-anchor="middle">kubelet</text></g>
<g id="k2"><rect x="445" y="302" width="185" height="40" rx="8"/><text class="th" x="537" y="327" text-anchor="middle">kubelet</text></g>
<g id="p1"><rect x="200" y="358" width="50" height="32" rx="6"/><text class="ts" x="225" y="378" text-anchor="middle">pod</text></g>
<g id="p2"><rect x="268" y="358" width="50" height="32" rx="6"/><text class="ts" x="293" y="378" text-anchor="middle">pod</text></g>
<g id="p3"><rect x="445" y="358" width="50" height="32" rx="6"/><text class="ts" x="470" y="378" text-anchor="middle">pod</text></g>
<g id="p4"><rect x="513" y="358" width="50" height="32" rx="6"/><text class="ts" x="538" y="378" text-anchor="middle">pod</text></g>
</svg>
<p id="cap"></p>
<p style="font-size:13px;color:#888780">Amber: the step uses or changes this part. Red: you break it on purpose.</p>
</main>
<script>
const base = { kubectl: "c-gray", api: "c-purple", etcd: "c-purple", sched: "c-purple", cm: "c-purple", kcp: "c-purple", k1: "c-teal", k2: "c-teal", p1: "c-teal", p2: "c-teal", p3: "c-teal", p4: "c-teal" };
const S = [
  { n: "Overview", hot: [], red: [], c: "Every arrow points at the API server. The scheduler, controller manager and both worker kubelets watch it; none of them talk to each other or to etcd directly." },
  { n: "1 · Static pods", hot: ["kcp", "api", "etcd", "sched", "cm"], red: [], c: "The control-plane kubelet starts the API server, etcd, scheduler and controller manager from files in /etc/kubernetes/manifests, without asking the API server." },
  { n: "2 · Ownership", hot: ["kubectl", "api", "etcd", "cm", "p1", "p2", "p3"], red: [], c: "kubectl writes a Deployment. The controller manager creates a ReplicaSet, then Pods. All three are objects in etcd, linked by ownerReferences." },
  { n: "3 · Reconcile", hot: ["cm", "sched", "k1", "k2", "p1", "p3"], red: [], c: "You delete a pod. The controller manager sees 2 of 3 and creates one, the scheduler assigns it a node, and that node's kubelet starts it." },
  { n: "4 · Raw API", hot: ["kubectl", "api"], red: [], c: "kubectl is just an HTTP client. The ?watch=1 stream you open is the same mechanism every controller uses." },
  { n: "5 · Conflict", hot: ["kubectl", "api", "etcd"], red: [], c: "Your stale file carries an old resourceVersion. The API server compares it with etcd and rejects the write. No locks involved." },
  { n: "6 · Break scheduler", hot: ["cm", "p4"], red: ["sched"], c: "With the scheduler gone, the controller manager still creates pods, but nobody assigns them a node, so they stay Pending." },
  { n: "7 · Break controller mgr", hot: ["p1", "p2"], red: ["cm"], c: "Deleted pods aren't replaced. When the controller manager restarts it compares desired vs actual state and catches up, even though it missed the deletes." }
];
const box = document.getElementById("steps");
function show(i) {
  const s = S[i];
  for (const id in base) document.getElementById(id).setAttribute("class", s.red.includes(id) ? "c-red" : s.hot.includes(id) ? "c-amber" : base[id]);
  document.getElementById("cap").textContent = s.c;
  [...box.children].forEach((b, j) => b.setAttribute("aria-pressed", j === i ? "true" : "false"));
}
S.forEach((s, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = s.n; b.onclick = () => show(i); box.appendChild(b); });
show(0);
</script>
</body>
</html>
