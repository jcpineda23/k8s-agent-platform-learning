<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1208" viewBox="0 0 1120 1208" role="img"><title>From kubectl create deployment to running pods</title><desc>Sequence diagram of the API server, etcd, Deployment and ReplicaSet controllers, scheduler and kubelet handling a new Deployment.</desc><defs><marker id="a-req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-reply" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-store" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-watch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.title{font-size:18px;font-weight:600;fill:#2C2C2A}.sub{font-size:13px;fill:#5F5E5A}.hd{font-size:14px;font-weight:600}.hs{font-size:11.5px}.ph{font-size:14px;font-weight:600;fill:#2C2C2A}.pd{font-size:12.5px;fill:#5F5E5A}.lb{font-size:12.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}.num{font-size:10.5px;font-weight:600}.lg{font-size:12.5px;fill:#444441}.foot{font-size:12.5px;fill:#5F5E5A}</style><rect width="1120" height="1208" fill="#FFFFFF"/><text class="title" x="40" y="40">What happens after: kubectl create deployment web --image=nginx --replicas=3</text><text class="sub" x="40" y="62">Every arrow goes through the API server. Components never talk to each other directly; they read and write records, and react to watch events.</text><line x1="90" y1="124" x2="90" y2="1058" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><rect x="24" y="80" width="132" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".6"/><text class="hd" x="90" y="99" text-anchor="middle" fill="#2C2C2A">You</text><text class="hs" x="90" y="115" text-anchor="middle" fill="#5F5E5A">kubectl</text><line x1="245" y1="124" x2="245" y2="1058" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><rect x="179" y="80" width="132" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width=".6"/><text class="hd" x="245" y="99" text-anchor="middle" fill="#26215C">API server</text><text class="hs" x="245" y="115" text-anchor="middle" fill="#534AB7">the front door</text><line x1="400" y1="124" x2="400" y2="1058" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><rect x="334" y="80" width="132" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width=".6"/><text class="hd" x="400" y="99" text-anchor="middle" fill="#26215C">etcd</text><text class="hs" x="400" y="115" text-anchor="middle" fill="#534AB7">the database</text><line x1="555" y1="124" x2="555" y2="1058" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><rect x="489" y="80" width="132" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".6"/><text class="hd" x="555" y="99" text-anchor="middle" fill="#4A1B0C">Deployment</text><text class="hs" x="555" y="115" text-anchor="middle" fill="#993C1D">controller</text><line x1="710" y1="124" x2="710" y2="1058" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><rect x="644" y="80" width="132" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".6"/><text class="hd" x="710" y="99" text-anchor="middle" fill="#4A1B0C">ReplicaSet</text><text class="hs" x="710" y="115" text-anchor="middle" fill="#993C1D">controller</text><line x1="865" y1="124" x2="865" y2="1058" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><rect x="799" y="80" width="132" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".6"/><text class="hd" x="865" y="99" text-anchor="middle" fill="#4A1B0C">Scheduler</text><text class="hs" x="865" y="115" text-anchor="middle" fill="#993C1D">picks nodes</text><line x1="1020" y1="124" x2="1020" y2="1058" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/><rect x="954" y="80" width="132" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".6"/><text class="hd" x="1020" y="99" text-anchor="middle" fill="#04342C">kubelet</text><text class="hs" x="1020" y="115" text-anchor="middle" fill="#0F6E56">on the node</text><rect x="20" y="156" width="1080" height="34" rx="6" fill="#F6F5F1"/><text class="ph" x="34" y="178">A · Record the intent</text><text class="pd" x="1086" y="178" text-anchor="end">Steps 1–4 happen in milliseconds. kubectl returns here, before anything runs.</text><line x1="93" y1="219.0" x2="239" y2="219.0" stroke="#534AB7" stroke-width="1.6" marker-end="url(#a-req)"/><text class="lb" x="102" y="212.0" fill="#3C3489">Create Deployment "web": 3 nginx pods</text><circle cx="70" cy="215.0" r="9" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text class="num" x="70" y="219.0" text-anchor="middle" fill="#3C3489">1</text><rect x="91.0" y="242.0" width="308" height="24" rx="5" fill="#FFF8EC" stroke="#BA7517" stroke-width=".7"/><text class="lb" x="245" y="258.0" text-anchor="middle" fill="#633806">Who are you? May you? Is the YAML valid?</text><circle cx="77.0" cy="254.0" r="9" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/><text class="num" x="77.0" y="258.0" text-anchor="middle" fill="#633806">2</text><line x1="248" y1="295.0" x2="394" y2="295.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a-store)"/><text class="lb" x="257" y="288.0" fill="#444441">Store the Deployment record</text><circle cx="225" cy="291.0" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text class="num" x="225" y="295.0" text-anchor="middle" fill="#444441">3</text><line x1="242" y1="333.0" x2="96" y2="333.0" stroke="#888780" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-reply)"/><text class="lb" x="102" y="326.0" fill="#5F5E5A">201 Created: "deployment.apps/web created"</text><circle cx="70" cy="329.0" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="1"/><text class="num" x="70" y="333.0" text-anchor="middle" fill="#5F5E5A">4</text><rect x="20" y="354" width="1080" height="34" rx="6" fill="#F6F5F1"/><text class="ph" x="34" y="376">B · Controllers act on the record</text><text class="pd" x="1086" y="376" text-anchor="end">Each controller watches one kind of record and creates the next.</text><line x1="248" y1="417.0" x2="549" y2="417.0" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-watch)"/><text class="lb" x="257" y="410.0" fill="#085041">Watch event: new Deployment</text><circle cx="225" cy="413.0" r="9" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/><text class="num" x="225" y="417.0" text-anchor="middle" fill="#085041">5</text><rect x="450.0" y="440.0" width="210" height="24" rx="5" fill="#FFF8EC" stroke="#BA7517" stroke-width=".7"/><text class="lb" x="555" y="456.0" text-anchor="middle" fill="#633806">Wants 1 ReplicaSet. Has 0.</text><circle cx="436.0" cy="452.0" r="9" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/><text class="num" x="436.0" y="456.0" text-anchor="middle" fill="#633806">6</text><line x1="552" y1="493.0" x2="251" y2="493.0" stroke="#534AB7" stroke-width="1.6" marker-end="url(#a-req)"/><text class="lb" x="257" y="486.0" fill="#3C3489">Create ReplicaSet web-7d4b9 (3 replicas)</text><circle cx="225" cy="489.0" r="9" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text class="num" x="225" y="493.0" text-anchor="middle" fill="#3C3489">7</text><line x1="248" y1="531.0" x2="394" y2="531.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a-store)"/><text class="lb" x="257" y="524.0" fill="#444441">Store the ReplicaSet record</text><circle cx="225" cy="527.0" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text class="num" x="225" y="531.0" text-anchor="middle" fill="#444441">8</text><line x1="248" y1="569.0" x2="704" y2="569.0" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-watch)"/><text class="lb" x="257" y="562.0" fill="#085041">Watch event: new ReplicaSet</text><circle cx="225" cy="565.0" r="9" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/><text class="num" x="225" y="569.0" text-anchor="middle" fill="#085041">9</text><rect x="626.0" y="592.0" width="168" height="24" rx="5" fill="#FFF8EC" stroke="#BA7517" stroke-width=".7"/><text class="lb" x="710" y="608.0" text-anchor="middle" fill="#633806">Wants 3 pods. Has 0.</text><circle cx="612.0" cy="604.0" r="9" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/><text class="num" x="612.0" y="608.0" text-anchor="middle" fill="#633806">10</text><line x1="707" y1="645.0" x2="251" y2="645.0" stroke="#534AB7" stroke-width="1.6" marker-end="url(#a-req)"/><text class="lb" x="257" y="638.0" fill="#3C3489">Create 3 Pods (no node assigned yet)</text><circle cx="225" cy="641.0" r="9" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text class="num" x="225" y="645.0" text-anchor="middle" fill="#3C3489">11</text><line x1="248" y1="683.0" x2="394" y2="683.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a-store)"/><text class="lb" x="257" y="676.0" fill="#444441">Store 3 Pod records, status Pending</text><circle cx="225" cy="679.0" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text class="num" x="225" y="683.0" text-anchor="middle" fill="#444441">12</text><rect x="20" y="704" width="1080" height="34" rx="6" fill="#F6F5F1"/><text class="ph" x="34" y="726">C · Place and run the pods</text><text class="pd" x="1086" y="726" text-anchor="end">Still only records so far. Now the scheduler and kubelet make them real.</text><line x1="248" y1="767.0" x2="859" y2="767.0" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-watch)"/><text class="lb" x="257" y="760.0" fill="#085041">Watch event: 3 pods with no node</text><circle cx="225" cy="763.0" r="9" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/><text class="num" x="225" y="767.0" text-anchor="middle" fill="#085041">13</text><rect x="760.0" y="790.0" width="210" height="24" rx="5" fill="#FFF8EC" stroke="#BA7517" stroke-width=".7"/><text class="lb" x="865" y="806.0" text-anchor="middle" fill="#633806">Filter and score the nodes</text><circle cx="746.0" cy="802.0" r="9" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/><text class="num" x="746.0" y="806.0" text-anchor="middle" fill="#633806">14</text><line x1="862" y1="843.0" x2="251" y2="843.0" stroke="#534AB7" stroke-width="1.6" marker-end="url(#a-req)"/><text class="lb" x="257" y="836.0" fill="#3C3489">Bind each pod to a node (spec.nodeName)</text><circle cx="225" cy="839.0" r="9" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text class="num" x="225" y="843.0" text-anchor="middle" fill="#3C3489">15</text><line x1="248" y1="881.0" x2="1014" y2="881.0" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-watch)"/><text class="lb" x="257" y="874.0" fill="#085041">Watch event: a pod for my node</text><circle cx="225" cy="877.0" r="9" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/><text class="num" x="225" y="881.0" text-anchor="middle" fill="#085041">16</text><rect x="865.0" y="904.0" width="231" height="24" rx="5" fill="#FFF8EC" stroke="#BA7517" stroke-width=".7"/><text class="lb" x="980.5" y="920.0" text-anchor="middle" fill="#633806">containerd + runc start nginx</text><circle cx="851.0" cy="916.0" r="9" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/><text class="num" x="851.0" y="920.0" text-anchor="middle" fill="#633806">17</text><line x1="1017" y1="957.0" x2="251" y2="957.0" stroke="#534AB7" stroke-width="1.6" marker-end="url(#a-req)"/><text class="lb" x="257" y="950.0" fill="#3C3489">Pod status: Running</text><circle cx="225" cy="953.0" r="9" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text class="num" x="225" y="957.0" text-anchor="middle" fill="#3C3489">18</text><line x1="248" y1="995.0" x2="704" y2="995.0" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-watch)"/><text class="lb" x="257" y="988.0" fill="#085041">Watch: pods ready → ReplicaSet status 3/3</text><circle cx="225" cy="991.0" r="9" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/><text class="num" x="225" y="995.0" text-anchor="middle" fill="#085041">19</text><line x1="248" y1="1033.0" x2="549" y2="1033.0" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-watch)"/><text class="lb" x="257" y="1026.0" fill="#085041">Watch: ReplicaSet ready → Deployment 3/3</text><circle cx="225" cy="1029.0" r="9" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/><text class="num" x="225" y="1033.0" text-anchor="middle" fill="#085041">20</text><line x1="40" y1="1088" x2="90" y2="1088" stroke="#534AB7" stroke-width="1.6" marker-end="url(#a-req)"/><text class="lg" x="102" y="1092">Request: create or update a record</text><line x1="560" y1="1088" x2="610" y2="1088" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a-store)"/><text class="lg" x="622" y="1092">API server writes to etcd</text><line x1="40" y1="1114" x2="90" y2="1114" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-watch)"/><text class="lg" x="102" y="1118">Watch event: the API server notifies a watcher</text><line x1="560" y1="1114" x2="610" y2="1114" stroke="#888780" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-reply)"/><text class="lg" x="622" y="1118">Response back to kubectl</text><rect x="40" y="1128" width="50" height="20" rx="4" fill="#FFF8EC" stroke="#BA7517" stroke-width=".7"/><text class="lg" x="102" y="1143">A component decides what to do: it compares what is wanted with what exists (reconciliation)</text><text class="foot" x="40" y="1178">Only the API server touches etcd. The two halves from Session 01: steps 1–4 store a record (data only); steps 5–20 are controllers turning records into running containers.</text></svg>
