<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Lab 1 cluster components</title>
<desc>A control-plane container holding the API server, etcd, scheduler, controller manager and kubelet, plus two worker containers each with a kubelet and web pods. kubectl on your Mac talks only to the API server.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
  .ts { font-size: 12px; fill: #5F5E5A; }
  .th { font-size: 14px; font-weight: 500; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: .5; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: .5; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: .5; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .frame { fill: none; stroke: #888780; stroke-width: .8; stroke-dasharray: 5 4; }
</style>
<rect width="680" height="440" fill="#FFFFFF"/>
<rect class="frame" x="180" y="20" width="470" height="210" rx="16"/>
<text class="ts" x="198" y="40">learn-control-plane · Docker container</text>
<rect class="frame" x="180" y="270" width="225" height="150" rx="16"/>
<text class="ts" x="198" y="290">learn-worker</text>
<rect class="frame" x="425" y="270" width="225" height="150" rx="16"/>
<text class="ts" x="443" y="290">learn-worker2</text>
<g class="gray"><rect x="30" y="56" width="130" height="56" rx="8"/>
<text class="th" x="95" y="80" text-anchor="middle">kubectl</text><text class="ts" x="95" y="98" text-anchor="middle">Your Mac</text></g>
<g class="purple"><rect x="200" y="56" width="260" height="56" rx="8"/>
<text class="th" x="330" y="80" text-anchor="middle">API server</text><text class="ts" x="330" y="98" text-anchor="middle">The only door to etcd</text></g>
<g class="purple"><rect x="480" y="56" width="150" height="56" rx="8"/>
<text class="th" x="555" y="80" text-anchor="middle">etcd</text><text class="ts" x="555" y="98" text-anchor="middle">Deploy → RS → Pods</text></g>
<g class="purple"><rect x="200" y="150" width="130" height="56" rx="8"/>
<text class="th" x="265" y="174" text-anchor="middle">Scheduler</text><text class="ts" x="265" y="192" text-anchor="middle">Picks a node</text></g>
<g class="purple"><rect x="350" y="150" width="130" height="56" rx="8"/>
<text class="th" x="415" y="174" text-anchor="middle">Controller mgr</text><text class="ts" x="415" y="192" text-anchor="middle">Fixes pod counts</text></g>
<g class="purple"><rect x="500" y="150" width="130" height="56" rx="8"/>
<text class="th" x="565" y="174" text-anchor="middle">kubelet</text><text class="ts" x="565" y="192" text-anchor="middle">Reads manifests</text></g>
<line class="arr" x1="160" y1="84" x2="198" y2="84" marker-end="url(#arrow)"/>
<line class="arr" x1="460" y1="84" x2="478" y2="84" marker-end="url(#arrow)"/>
<line class="arr" x1="265" y1="150" x2="265" y2="114" marker-end="url(#arrow)"/>
<line class="arr" x1="415" y1="150" x2="415" y2="114" marker-end="url(#arrow)"/>
<g class="teal"><rect x="200" y="302" width="185" height="40" rx="8"/><text class="th" x="292" y="327" text-anchor="middle">kubelet</text></g>
<g class="teal"><rect x="445" y="302" width="185" height="40" rx="8"/><text class="th" x="537" y="327" text-anchor="middle">kubelet</text></g>
<g class="teal"><rect x="200" y="358" width="50" height="32" rx="6"/><text class="ts" x="225" y="378" text-anchor="middle">pod</text></g>
<g class="teal"><rect x="268" y="358" width="50" height="32" rx="6"/><text class="ts" x="293" y="378" text-anchor="middle">pod</text></g>
<g class="teal"><rect x="445" y="358" width="50" height="32" rx="6"/><text class="ts" x="470" y="378" text-anchor="middle">pod</text></g>
<g class="teal"><rect x="513" y="358" width="50" height="32" rx="6"/><text class="ts" x="538" y="378" text-anchor="middle">pod</text></g>
</svg>
